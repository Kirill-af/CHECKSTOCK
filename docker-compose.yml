services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://checkstock:checkstock@db:5432/checkstock
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: